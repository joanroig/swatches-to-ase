name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  cla-assistant:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read and agree to the Contributor License Agreement'))
    runs-on: ubuntu-latest
    steps:
      - name: Check Contributor License Agreement
        # Final v2.6.1 release pinned to its immutable commit.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/joanroig/palette-studio/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: joanroig,dependabot[bot],github-actions[bot],renovate[bot]
          custom-pr-sign-comment: I have read and agree to the Contributor License Agreement
          lock-pullrequest-aftermerge: true
