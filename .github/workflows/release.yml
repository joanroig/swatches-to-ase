name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Select the version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - none
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"

      - name: Bump and commit version
        if: github.event.inputs.version_bump != 'none'
        run: |
          new_version=$(node scripts/bump-version.mjs ${{ github.event.inputs.version_bump }})
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Bump version to $new_version"

      - name: Push changes
        if: github.event.inputs.version_bump != 'none'
        run: git push origin HEAD:${{ github.ref_name }}

      - name: Create or move tag
        id: tag
        run: |
          version=$(node scripts/bump-version.mjs none)
          tag="v$version"
          git fetch --tags
          git tag -d "$tag" || true
          git push --delete origin "$tag" || true
          git tag "$tag"
          git push origin "$tag"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ${{ matrix.os }}
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_CHECK_KEY: ${{ secrets.VITE_FIREBASE_APP_CHECK_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            target: dmg
            arch_flag: "--arm64"
            artifact_suffix: "macos-arm64-installer.dmg"
          - os: macos-latest
            platform: mac
            target: zip
            arch_flag: "--arm64"
            artifact_suffix: "macos-arm64-portable.zip"
          - os: macos-26-intel
            platform: mac
            target: dmg
            arch_flag: "--x64"
            artifact_suffix: "macos-x64-installer.dmg"
          - os: macos-26-intel
            platform: mac
            target: zip
            arch_flag: "--x64"
            artifact_suffix: "macos-x64-portable.zip"
          - os: windows-latest
            platform: win
            target: nsis
            arch_flag: ""
            artifact_suffix: "windows-installer.exe"
          - os: windows-latest
            platform: win
            target: zip
            arch_flag: ""
            artifact_suffix: "windows-portable.zip"
          - os: ubuntu-latest
            platform: linux
            target: AppImage
            arch_flag: ""
            artifact_suffix: "linux-amd64-portable.AppImage"
          - os: ubuntu-latest
            platform: linux
            target: deb
            arch_flag: ""
            artifact_suffix: "linux-amd64-installer.deb"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build desktop packages
        shell: bash
        run: |
          # Unset empty code signing variables to prevent electron-builder from reading the current directory as a file
          [ -z "$CSC_LINK" ] && unset CSC_LINK
          [ -z "$CSC_KEY_PASSWORD" ] && unset CSC_KEY_PASSWORD
          [ -z "$APPLE_ID" ] && unset APPLE_ID
          [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] && unset APPLE_APP_SPECIFIC_PASSWORD
          [ -z "$APPLE_TEAM_ID" ] && unset APPLE_TEAM_ID

          npm run build:desktop
          npx --no-install electron-builder --publish never --${{ matrix.platform }} ${{ matrix.target }} ${{ matrix.arch_flag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF: refs/tags/${{ needs.version.outputs.tag }}
          GITHUB_REF_NAME: ${{ needs.version.outputs.tag }}
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || matrix.platform == 'win' && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # The build legs hand their package to the release job rather than publishing it themselves.
      # Eight legs each asking the API to generate release notes wrote the changelog into the body
      # eight times, which is what a v4.1.6 release full of repeated "Full Changelog" lines was.
      - name: Hand the package to the release job
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.artifact_suffix }}
          path: release/palette-studio-v${{ needs.version.outputs.version }}-${{ matrix.artifact_suffix }}
          if-no-files-found: error
          retention-days: 1
          # Installers are compressed already; running them through zlib again only costs minutes.
          compression-level: 0

  release:
    needs: [version, build]
    # Runs even when a leg failed, so one unlucky runner costs that one package rather than the
    # whole release — which is what the per-leg upload used to give us.
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Collect the packages
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          merge-multiple: true
          path: packages

      # Two attempts, because this step talks to the API and the runners' DNS occasionally is not
      # there: a macOS leg of v4.1.4 built its zip fine and then lost the whole release job to
      # `getaddrinfo ENOTFOUND api.github.com`. The action has no retry of its own, and there is no
      # step-level retry in Actions, so the second attempt is a second step. Keep the two `with:`
      # blocks identical.
      - name: Publish the release
        id: publish
        uses: softprops/action-gh-release@v3
        continue-on-error: true
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Release ${{ needs.version.outputs.tag }}
          files: packages/*
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the release (retry)
        if: steps.publish.outcome == 'failure'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Release ${{ needs.version.outputs.tag }}
          files: packages/*
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
