<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Public assets live beside this document in packaged builds, but at the origin root on the
      // hosted app. Defining the base before any resource references keeps both cases working,
      // including Firebase rewrite URLs that end in a slash.
      const appBase = document.createElement("base");
      appBase.href = window.location.protocol === "file:" ? new URL(".", window.location.href).toString() : "/";
      document.head.append(appBase);
    </script>
    <meta name="theme-color" content="#eef1f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f111a" media="(prefers-color-scheme: dark)" />

    <title>Palette Studio — Create, organize and export color palettes</title>
    <meta
      name="description"
      content="Build color palettes in your browser, organize them into folders, and export to Procreate .swatches, Adobe ASE, GIMP .gpl, CSS, Tailwind, SVG and more. Free with source available."
    />
    <link rel="canonical" href="https://palettes.web.app/" />
    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Palette Studio" />
    <meta property="og:url" content="https://palettes.web.app/" />
    <meta property="og:title" content="Palette Studio — Create, organize and export color palettes" />
    <meta
      property="og:description"
      content="Build color palettes in your browser, organize them into folders, and export to Procreate, Adobe ASE, GIMP, CSS, Tailwind and more."
    />
    <meta property="og:image" content="https://palettes.web.app/og-image.png" />
    <meta property="og:image:width" content="916" />
    <meta property="og:image:height" content="625" />
    <meta property="og:image:alt" content="The Palette Studio library, showing color palettes grouped into folders." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Palette Studio — Create, organize and export color palettes" />
    <meta
      name="twitter:description"
      content="Build color palettes in your browser, organize them into folders, and export to Procreate, Adobe ASE, GIMP, CSS, Tailwind and more."
    />
    <meta name="twitter:image" content="https://palettes.web.app/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="favicon.svg" />
    <link rel="manifest" href="site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Loaded asynchronously: a synchronous Google Fonts stylesheet blocks the first render, and the
      app already paints correctly in the fallback stack until the webfonts arrive.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap"
      />
    </noscript>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Palette Studio",
        "url": "https://palettes.web.app/",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Any",
        "description": "Create, organize and export color palettes. Import and export Procreate .swatches, Adobe ASE and GIMP .gpl, and copy CSS, Tailwind, SVG or code snippets.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "license": "https://polyformproject.org/licenses/shield/1.0.0",
        "author": { "@type": "Person", "name": "Joan Roig" }
      }
    </script>
    <style>
      :root {
        background: #eef1f7;
        color: #141627;
      }
      :root[data-theme="noir"] {
        background: #0f111a;
        color: #f8fafc;
      }
      :root[data-theme="graphite"] {
        background: #141822;
        color: #f1f5f9;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: inherit;
        color: inherit;
      }
      body:not(.is-ready) .page {
        visibility: hidden;
      }
      .loading-screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: inherit;
        color: inherit;
        font-family: "Segoe UI", system-ui, sans-serif;
        z-index: 1000;
      }
    </style>
    <script>
      try {
        const raw = localStorage.getItem("palette-studio.preferences");
        if (raw) {
          const prefs = JSON.parse(raw);
          if (prefs && prefs.theme) {
            document.documentElement.dataset.theme = prefs.theme;
          }
        }
      } catch {
        // Ignore theme pre-hydration failures.
      }
    </script>
    <link rel="stylesheet" href="/src/style.scss" />
  </head>
  <body>
    <div id="app-root"></div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
