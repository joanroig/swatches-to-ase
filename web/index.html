<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Palette Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap"
    />
    <style>
      :root {
        background: #eef1f7;
        color: #141627;
      }
      :root[data-theme="noir"] {
        background: #0f111a;
        color: #f8fafc;
      }
      :root[data-theme="graphite"] {
        background: #141822;
        color: #f1f5f9;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: inherit;
        color: inherit;
      }
      body:not(.is-ready) .page {
        visibility: hidden;
      }
      .loading-screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: inherit;
        color: inherit;
        font-family: "Segoe UI", system-ui, sans-serif;
        z-index: 1000;
      }
    </style>
    <script>
      try {
        const raw = localStorage.getItem("palette-studio.preferences");
        if (raw) {
          const prefs = JSON.parse(raw);
          if (prefs && prefs.theme) {
            document.documentElement.dataset.theme = prefs.theme;
          }
        }
      } catch {
        // Ignore theme pre-hydration failures.
      }
    </script>
    <link rel="stylesheet" href="/src/style.scss" />
  </head>
  <body>
    <div id="app-root"></div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
